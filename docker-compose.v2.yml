services:
  postgres-v2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scory_v2
      POSTGRES_USER: scory
      POSTGRES_PASSWORD: scory
    ports:
      - "5433:5432"
    volumes:
      - scory-postgres-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scory -d scory_v2"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-v2:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - scory-redis-v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scory-postgres-v2:
  scory-redis-v2:
